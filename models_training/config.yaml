run:
  mode: "slurm" # "local" or "slurm"
  task: "detection"
  output_dir: "results" # where training outputs/logs go
  train_script: "train.py" # training entry script

slurm:
  account: "YOUR_SLURM_ACCOUNT" # TODO: replace with your NTNU Slurm account name
  partition: "GPUQ" # queue/partition to use
  gpus: 1 # number of GPUs
  gpu_type: "a100" # requested GPU model
  constraint: "gpu40g|gpu80g|gpu32g" # allowed GPU memory types
  cpus: 10 # CPU cores allocated
  mem: "32G" # RAM allocated
  time: "4:00:00" # job time limit
  nodes: 1 # number of nodes
  ntasks: 1 # tasks per job

models:
  detection:
    # Run src/prepare_dataset.py first to generate this file from the 5 game folders.
    # python src/prepare_dataset.py --dataset-root /cluster/projects/vc/courses/TDT17/other/Football2025
    dataset_path: "/cluster/projects/vc/courses/TDT17/other/Football2025/football.yaml"
    # On Cybele: python src/prepare_dataset.py --dataset-root /datasets/tdt4265/Football2025
    model: "rtdetr-l.pt" # RT-DETR large, pretrained on COCO
    epochs: 100 # training epochs
    batch: 8 # batch size (use -1 for auto, but RT-DETR may need explicit value)
    imgsz: 640 # image resolution
    patience: 20 # early-stop patience
    requirements: "requirements.txt" # dependency file
    # Class weights to compensate for ball class imbalance [player, referee, ball]
    cls_weights: [1.0, 2.0, 5.0]
    export: ["onnx"] # export trained model after training
