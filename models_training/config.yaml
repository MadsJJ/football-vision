run:
  mode: "slurm" # "local" or "slurm"
  task: "detection"
  output_dir: "results" # where training outputs/logs go
  train_script: "train.py" # training entry script

slurm:
  account: "share-ie-idi"
  partition: "GPUQ" # queue/partition to use
  gpus: 1 # number of GPUs
  gpu_type: "a100" # requested GPU model
  constraint: "gpu40g|gpu80g" # 32g not enough for imgsz 1280 + rtdetr-l
  cpus: 10 # CPU cores allocated
  mem: "64G" # increased for disk cache
  time: "12:00:00" # 100 epochs at imgsz 1280 takes longer
  nodes: 1 # number of nodes
  ntasks: 1 # tasks per job

models:
  detection:
    # Run src/prepare_dataset.py first to generate this file:
    # python src/prepare_dataset.py \
    #     --dataset-root /cluster/projects/vc/courses/TDT17/other/Football2025 \
    #     --output-dir data/
    dataset_path: "../data/football.yaml"
    model: "rtdetr-l.pt" # RT-DETR large, pretrained on COCO
    epochs: 100 # training epochs
    batch: -1 # reduced from 8 to fit imgsz 1280 in GPU memory
    imgsz: 1280 # increased from 640 — critical for small ball detection
    patience: 20 # early-stop patience
    cache: "ram" # load preprocessed images into RAM after epoch 1; faster than NFS reads
                 # ~28 GB for 10k frames at imgsz 1280 — fits in the 64 GB allocated
                 # if job OOMs during caching, change to "disk"
    cos_lr: true # cosine LR schedule, better for long runs
    cls: 2.0 # upweight classification loss to compensate for ball class imbalance
    close_mosaic: 20 # disable mosaic augmentation for last 20 epochs
    classes: [0, 1] # only player and ball; event_labels (2) is unused in this dataset
    requirements: "requirements.txt" # dependency file
export: ["onnx"] # export trained model after training
